name: 'Quality Gate'

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend-and-audits:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolver módulos Go
        working-directory: backend
        run: go mod tidy
      - name: Testes Go com race detector
        working-directory: backend
        run: go test -race ./...
      - name: Auditores canônicos
        run: |
          node tools/audit-content.mjs
          node tools/audit-camp-content.mjs
          node tools/audit-economy.mjs
          node tools/audit-resource-usage.mjs
          node tools/audit-settlement-viewport.mjs
          node tools/audit-security.mjs

  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Instalar dependências
        working-directory: frontend
        run: npm install
      - name: Build TypeScript/Vite
        working-directory: frontend
        run: npm run build
