services:
  postgres:
    image: postgres:16-alpine
    container_name: atlas-postgres
    restart: always
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_password
      POSTGRES_DB: atlas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c shared_buffers=128MB -c max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 50mb --maxmemory-policy allkeys-lru

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: atlas-backend
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=atlas
      - DB_PASSWORD=atlas_password
      - DB_NAME=atlas_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=8080
      - ENVIRONMENT=development
      - ATLAS_DEV_TOOLS_ENABLED=true
      - ATLAS_DEV_ADMIN_EMAIL=atlas-admin@local.test
      - ATLAS_DEV_ADMIN_PASSWORD=AtlasTest!2026
      - ATLAS_DEV_PVP_QA_A_EMAIL=pvp-qa-a@local.test
      - ATLAS_DEV_PVP_QA_A_PASSWORD=PvPQAAlpha!2026
      - ATLAS_DEV_PVP_QA_B_EMAIL=pvp-qa-b@local.test
      - ATLAS_DEV_PVP_QA_B_PASSWORD=PvPQABravo!2026
      - ATLAS_DEV_PVP_QA_C_EMAIL=pvp-qa-c@local.test
      - ATLAS_DEV_PVP_QA_C_PASSWORD=PvPQAMage!2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: node:22-alpine
    container_name: atlas-frontend
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
      - VITE_WS_BASE_URL=ws://localhost:8080
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
